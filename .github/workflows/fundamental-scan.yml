name: Daily Fundamental Stock Scanner

on:
  workflow_dispatch:
  schedule:
    # 17:00 IST (11:30 UTC), weekdays after the cash-market session.
    - cron: '30 11 * * 1-5'

permissions:
  contents: read

jobs:
  fundamental-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run NSE fundamental scanner
        env:
          PYTHONUNBUFFERED: '1'
          SCAN_LIMIT: '0'
        run: python main.py

      - name: Upload scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-scanner-results
          path: final_scanner_results.csv
          if-no-files-found: warn
          retention-days: 14
